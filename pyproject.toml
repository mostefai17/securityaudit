[project]
name = "securityaudit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "certifi==2026.7.22",
    "cffi==2.1.0",
    "chardet==7.4.3",
    "charset-normalizer==3.4.9",
    "contourpy==1.3.3",
    "cryptography==49.0.0",
    "cycler==0.12.1",
    "django==6.0.7",
    "fonttools==4.63.0",
    "idna==3.18",
    "kiwisolver==1.5.0",
    "lxml==6.1.1",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "packaging==26.2",
    "pillow==12.3.0",
    "pycparser==3.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "requests-mock==1.12.1",
    "requests==2.34.2",
    "response==0.5.0",
    "robots==0.1.5",
    "scipy==1.18.0",
    "sitemap==20191121",
    "six==1.17.0",
    "sqlparse==0.5.5",
    "urllib3==2.7.0",
    "urlnormalizer==1.2.5",
    "gunicorn==26.0.0",
    "psycopg2-binary==2.9.12",
]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pyright>=1.1.414",
    "ruff>=0.17.2",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "securityaudit.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"

[tool.pyright]
venv = ".venv"
venvPath = "."
