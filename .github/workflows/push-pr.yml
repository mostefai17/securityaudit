on:
  push:
    branches:
      - development
      - "feature/**"
      - "release/**"
    paths:
      - "src/**"

  pull_request:
    branches:
      - development 
      - "feature/**"
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 
        uses: actions/checkout@v6.1.0

      - name: run tests
        run: uv run pytest


    
